<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Breakero — Broken Access Control Scanner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0f16"/>
      <stop offset="0.55" stop-color="#12141d"/>
      <stop offset="1" stop-color="#1a1424"/>
    </linearGradient>
    <linearGradient id="bshield" x1="96" y1="70" x2="240" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="330" y1="120" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f5ff"/>
      <stop offset="1" stop-color="#c7b6ff"/>
    </linearGradient>
    <linearGradient id="bcrack" x1="168" y1="86" x2="168" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="bglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bbg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1120" cy="70" r="260" fill="#6366f1" fill-opacity="0.05"/>
  <circle cx="1180" cy="300" r="200" fill="#c026d3" fill-opacity="0.05"/>

  <!-- emblem -->
  <g transform="translate(72,44)">
    <path d="M96 26 L168 54 V120 C168 166 136 198 96 214 C56 198 24 166 24 120 V54 Z"
          fill="url(#bshield)" opacity="0.16"/>
    <path d="M96 26 L168 54 V120 C168 166 136 198 96 214 C56 198 24 166 24 120 V54 Z"
          fill="none" stroke="url(#bshield)" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="96" cy="108" r="19" fill="none" stroke="url(#bshield)" stroke-width="7"/>
    <path d="M96 124 L88 160 H104 Z" fill="url(#bshield)"/>
    <path d="M118 40 L76 108 L102 114 L64 196"
          fill="none" stroke="url(#bcrack)" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#bglow)"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="176" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"
        font-size="104" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">Breakero</text>

  <!-- tagline -->
  <text x="334" y="224" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"
        font-size="30" font-weight="500" letter-spacing="0.5" fill="#aab0c0">Broken Access Control Scanner</text>

  <!-- pill -->
  <g transform="translate(334,244)">
    <rect x="0" y="0" width="330" height="40" rx="20" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="165" y="26" text-anchor="middle"
          font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif"
          font-size="18" font-weight="600" letter-spacing="1.5" fill="#c7c9ff">OWASP TOP 10 · 2025 · A01</text>
  </g>
</svg>
